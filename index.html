    /*
    =====================================================
    ADJUSTED PLAYER VALUE
    =====================================================

    This is the superstar premium.

    Examples with factor 1.25:

    100 base = 100 adjusted
    90 base  = about 87.7
    80 base  = about 75.7
    70 base  = about 64.0
    60 base  = about 52.8
    50 base  = about 42.0

    This means two 50-value players no longer equal
    one 100-value superstar.
    */

    function getAdjustedPlayerValue(baseValue) {

        if (baseValue <= 0) {
            return 0;
        }

        return 100 *
            Math.pow(
                baseValue / 100,
                SUPERSTAR_FACTOR
            );

    }


    /*
    =====================================================
    PACKAGE VALUE
    =====================================================

    Players are sorted from most valuable to least valuable.

    The first player gets full value.

    Each additional asset receives a slightly lower weight.
    */

    function calculateAdjustedTeamValue(team) {

        if (team.length === 0) {
            return 0;
        }


        const adjustedPlayers =
            team.map(player => ({

                ...player,

                adjustedValue:
                    getAdjustedPlayerValue(
                        player.value
                    )

            }));


        adjustedPlayers.sort(
            (a, b) =>
                b.adjustedValue -
                a.adjustedValue
        );


        return adjustedPlayers.reduce(
            (total, player, index) => {

                const packageWeight =
                    PACKAGE_WEIGHTS[index] ?? 0.80;


                return total +
                    (
                        player.adjustedValue *
                        packageWeight
                    );

            },
            0
        );

    }


    function setupSearch(teamId, teamArray) {

        const input =

            document.getElementById(
                "dropdown-" + teamId
            );


        input.addEventListener("input", () => {

            const query =
                input.value
                    .toLowerCase()
                    .trim();


            dropdown.innerHTML = "";


            if (!query) {

                dropdown.style.display =
                    "none";

                return;

            }


            const matches =
                playerDatabase.filter(
                    player =>
                        player.name
                            .toLowerCase()
                            .includes(query)
                );


            if (matches.length === 0) {

                dropdown.style.display =

                return;

            }


            dropdown.style.display =
                "block";


            matches.forEach(player => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "dropdown-item";


                item.innerText =
                    "#" +
                    player.rank +
                    " " +
                    player.name +
                    " (" +
                    player.pos +
                    ") " +
                    player.trend +
                    " - Value: " +
                    player.value.toFixed(1);


                item.addEventListener(
                    "click",
                    () => {

                        const playerAlreadyAdded =
                            [
                                ...teamA,
                                ...teamB
                            ].some(
                                selectedPlayer =>
                                    selectedPlayer.name ===
                                    player.name
                            );


                        if (playerAlreadyAdded) {

                            alert(
                                player.name +
                                " is already included in this trade."
                            );

                        }

                        else if (
                            teamArray.length < 8
                        ) {

                            teamArray.push(
                                player
                            );


                            renderTeams();
                            calculateTrade();

                        }

                        else {

                            alert(
                                "Maximum capacity reached. Max 8 players per side."
                            );

                        }


                        input.value = "";

                        dropdown.innerHTML =
                            "";

                        dropdown.style.display =
                            "none";

                    }
                );


                dropdown.appendChild(
                    item
                );

            });

        });


        document.addEventListener(
            "click",
            event => {

                    !input.contains(
                        event.target
                    ) &&
                    !dropdown.contains(
                        event.target
                    )
                ) {

                    dropdown.style.display =
                        "none";

                }

            }
        );

    }

    function calculateTrade() {

        /*
        Raw values are still calculated.

        These are useful for reference but are NOT
        what determines the winner anymore.
        */

        const rawTotalA =
            teamA.reduce(
                (sum, player) =>
                    sum +
                    player.value,
                0
            );


        const rawTotalB =
            teamB.reduce(
                (sum, player) =>
                    sum +
                    player.value,
                0
            );


        /*
        These adjusted totals are what the trade
        analyzer now actually uses.
        */

        const adjustedA =
            calculateAdjustedTeamValue(
                teamA
            );


        const adjustedB =
            calculateAdjustedTeamValue(
                teamB
            );


        /*
        Show both raw and adjusted value so users
        understand what the analyzer is doing.
        */

        document.getElementById(
            "total-a"
        ).innerText =
            "Base: " +
            rawTotalA.toFixed(1) +
            " | Adjusted: " +
            adjustedA.toFixed(1);


        document.getElementById(
            "total-b"
        ).innerText =
            "Base: " +
            rawTotalB.toFixed(1) +
            " | Adjusted: " +
            adjustedB.toFixed(1);


        const meterBar =
            document.getElementById(
                "meter-bar"
            );


        const meterText =
            document.getElementById(
                "meter-percentage"
            );


        /*
        The meter now uses ADJUSTED value.
        */

        if (
            adjustedA === 0 &&
            adjustedB === 0
        ) {

            meterBar.style.width =
                "50%";


            meterText.innerText =
                "50% / 50%";

        }

        else {

            const combinedAdjustedValue =
                adjustedA +
                adjustedB;


            const percentageA =
                Math.round(
                    (
                        adjustedA /
                        combinedAdjustedValue
                    ) * 100
                );


            const percentageB =
                100 -
                percentageA;


            meterBar.style.width =
                percentageA +
                "%";


            meterText.innerText =
                percentageA +
                "% / " +
                percentageB +
                "%";

        }


        const heading =
            document.getElementById(
                "verdict-heading"
            );


        /*
        No players entered.
        */

        if (
            teamA.length === 0 &&
            teamB.length === 0
        ) {

            heading.innerText =
                "Add players to analyze";

            return;

        }


        /*
        Only one side entered.
        */

        if (
            teamA.length === 0 ||
            teamB.length === 0
        ) {

            heading.innerText =
                "Add players to both sides";

            return;

        }


        /*
        Calculate percentage difference between
        the adjusted trade packages.
        */

        const difference =
            Math.abs(
                adjustedA -
                adjustedB
            );


        const averageValue =
            (
                adjustedA +
                adjustedB
            ) / 2;


        const differencePercent =
            averageValue > 0
                ? (
                    difference /
                    averageValue
                ) * 100
                : 0;


        /*
        =================================================
        TRADE VERDICT
        =================================================

        0-5%   = Fair Trade
        5-10%  = Slight Advantage
        10-20% = Clear Advantage
        20%+   = Major Advantage
        */


        if (
            differencePercent <= 5
        ) {

            heading.innerText =
                "Fair Trade";

        }


        else if (
            differencePercent <= 10
        ) {

            heading.innerText =
                adjustedA >
                adjustedB
                    ? "Slight Advantage: Team A"
                    : "Slight Advantage: Team B";

        }


        else if (
            differencePercent <= 20
        ) {

            heading.innerText =
                adjustedA >
                adjustedB
                    ? "Advantage: Team A"
                    : "Advantage: Team B";

        }


        else {

            heading.innerText =
                adjustedA >
                adjustedB
                    ? "Major Advantage: Team A"
                    : "Major Advantage: Team B";

        }

    }


    function setupThemeToggle() {

        const toggleButton =
            document.getElementById(
                "theme-toggle"
            );


        const htmlElement =
            document.documentElement;


        toggleButton.addEventListener(
            "click",
            () => {

                const currentTheme =
                    htmlElement.getAttribute(
                        "data-theme"
                    );


                const newTheme =
                    currentTheme === "dark"
                        ? "light"
                        : "dark";


                htmlElement.setAttribute(
                    "data-theme",
                    newTheme
                );

            }
        );

    }

</script>
