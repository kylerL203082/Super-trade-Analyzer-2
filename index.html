        /* =====================================================
           REFERENCE BOARD
        ====================================================== */

        function buildReferenceBoard() {

            renderTopPlayers("RB", "top-rb");
            renderTopPlayers("WR", "top-wr");
            renderTopPlayers("QB", "top-qb");
            renderTopPlayers("TE", "top-te");

        }


        function renderTopPlayers(position, elementId) {

            const container =
                document.getElementById(elementId);

            const players =
                playerDatabase
                    .filter(function (player) {
                        return player.pos === position;
                    })
                    .sort(function (a, b) {
                        return a.rank - b.rank;
                    })
                    .slice(0, 3);

            container.innerHTML = "";

            players.forEach(
                function (player) {

                    const line =
                        document.createElement("p");

                    line.textContent =
                        player.rank +
                        ". " +
                        abbreviateName(player.name) +
                        " (" +
                        player.value.toFixed(1) +
                        ")";

                    container.appendChild(line);

                }
            );

        }


        function abbreviateName(name) {

            const parts =
                name.trim().split(/\s+/);

            if (parts.length === 1) {
                return parts[0];
            }

            const firstInitial =
                parts[0].charAt(0) + ".";

            const lastName =
                parts.slice(1).join(" ");

            return (
                firstInitial +
                " " +
                lastName
            );

        }


        /* =====================================================
           SUPERSTAR VALUE CURVE
        ====================================================== */

        function getAdjustedPlayerValue(baseValue) {

            if (
                typeof baseValue !== "number" ||
                baseValue <= 0
            ) {

                return 0;

            }

            return (
                100 *
                Math.pow(
                    baseValue / 100,
                    SUPERSTAR_FACTOR
                )
            );

        }


        /* =====================================================
           PACKAGE / CONSOLIDATION VALUE
        ====================================================== */

        function calculateAdjustedTeamValue(team) {

            if (
                !Array.isArray(team) ||
                team.length === 0
            ) {

                return 0;

            }

            const adjustedPlayers =
                team.map(
                    function (player) {

                        return {
                            player: player,
                            adjustedValue:
                                getAdjustedPlayerValue(
                                    player.value
                                )
                        };

                    }
                );

            adjustedPlayers.sort(
                function (a, b) {

                    return (
                        b.adjustedValue -
                        a.adjustedValue
                    );

                }
            );

            return adjustedPlayers.reduce(
                function (total, item, index) {

                    const weight =
                        PACKAGE_WEIGHTS[index] !== undefined
                            ? PACKAGE_WEIGHTS[index]
                            : 0.80;

                    return (
                        total +
                        item.adjustedValue *
                        weight
                    );

                },
                0
            );

        }

                            .trim();

                    dropdown.innerHTML = "";

                    if (!query) {

                        dropdown.style.display =
                            "none";

                        return;

                    }

                    const matches =
                        playerDatabase
                            .filter(
                                function (player) {

                                    return player.name
                                        .toLowerCase()
                                        .includes(query);

                                }
                            )
                            .sort(
                                function (a, b) {

                                    return (
                                        a.rank -
                                        b.rank
                                    );

                                }
                            );

                    if (
                        matches.length === 0
                    ) {

                        dropdown.style.display =
                            "none";

                        return;

                    }

                    dropdown.style.display =
                        "block";

                    matches.forEach(
                        function (player) {

                            const item =
                                document.createElement(
                                    "div"
                                );

                            item.className =
                                "dropdown-item";

                            item.textContent =
                                "#" +
                                player.rank +
                                " " +
                                player.name +
                                " (" +
                                player.pos +
                                ") " +
                                player.trend +
                                " - Value: " +
                                player.value.toFixed(1);

                            item.addEventListener(
                                "click",
                                function () {

                                    addPlayerToTrade(
                                        player,
                                        teamArray
                                    );

                                    input.value =
                                        "";

                                    dropdown.innerHTML =
                                        "";

                                    dropdown.style.display =
                                        "none";

                                }
                            );

                            dropdown.appendChild(
                                item
                            );

                        }
                    );

                }
            );

            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !input.contains(
                            event.target
                        ) &&
                        !dropdown.contains(
                            event.target
                        )
                    ) {

                        dropdown.style.display =
                            "none";

                    }

                }
            );

        }


        /* =====================================================
           ADD PLAYER
        ====================================================== */

        function addPlayerToTrade(
            player,
            destinationTeam
        ) {

            const playerAlreadyAdded =
                teamA
                    .concat(teamB)
                    .some(
                        function (selectedPlayer) {

                            return (
                                selectedPlayer.rank ===
                                player.rank
                            );

                        }
                    );

            if (playerAlreadyAdded) {

                alert(
                    player.name +
                    " is already included in this trade."
                );

                return;

            }

            if (
                destinationTeam.length >= 8
            ) {

                alert(
                    "Maximum capacity reached. Max 8 players per side."
                );

                return;

            }

            destinationTeam.push(player);

            renderTeams();

            calculateTrade();

        }


        /* =====================================================
           RENDER TEAMS
        ====================================================== */

        function renderTeams() {

            renderTeam(
                "a",
                teamA
            );

            renderTeam(
                "b",
                teamB
            );

        }


        function renderTeam(
            teamId,
            teamArray
        ) {

            const list =
                document.getElementById(
                    "team-list-" + teamId
                );

            list.innerHTML = "";

            teamArray.forEach(
                function (player, index) {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "player-row";


                    const removeButton =
                        document.createElement(
                            "button"
                        );

                    removeButton.className =
                        "remove-btn";

                    removeButton.type =
                        "button";

                    removeButton.textContent =
                        "✕";

                    removeButton.setAttribute(
                        "aria-label",
                        "Remove " +
                        player.name
                    );

                    removeButton.addEventListener(
                        "click",
                        function () {

                            removePlayer(
                                teamId,
                                index
                            );

                        }
                    );


                    const position =
                        document.createElement(
                            "span"
                        );

                    position.className =
                        "pos-badge";

                    position.textContent =
                        player.pos;


                    const playerName =
                        document.createElement(
                            "span"
                        );

                    playerName.className =
                        "player-name";

                    playerName.textContent =
                        player.name;


                    const trend =
                        document.createElement(
                            "span"
                        );

                    trend.className =
                        "trend-indicator";

                    trend.textContent =
                        player.trend;


                    const score =
                        document.createElement(
                            "span"
                        );

                    score.className =
                        "player-score-label";

                    score.textContent =
                        player.value.toFixed(1);


                    if (
                        teamId === "a"
                    ) {

                        row.appendChild(
                            removeButton
                        );

                        row.appendChild(
                            position
                        );

                        row.appendChild(
                            playerName
                        );

                        row.appendChild(
                            trend
                        );

                        row.appendChild(
                            score
                        );

                    }

                    else {

                        row.appendChild(
                            score
                        );

                        row.appendChild(
                            position
                        );

                        row.appendChild(
                            playerName
                        );

                        row.appendChild(
                            trend
                        );

                        row.appendChild(
                            removeButton
                        );

                    }

                    list.appendChild(
                        row
                    );

                }
            );

        }


        /* =====================================================
           REMOVE PLAYER
        ====================================================== */

        function removePlayer(
            teamId,
            index
        ) {

            if (
                teamId === "a"
            ) {

                teamA.splice(
                    index,
                    1
                );

            }

            else if (
                teamId === "b"
            ) {

                teamB.splice(
                    index,
                    1
                );

            }

            renderTeams();

            calculateTrade();

        }


        /* =====================================================
           TRADE CALCULATION
        ====================================================== */

        function calculateTrade() {

            const rawTotalA =
                calculateRawValue(
                    teamA
                );

            const rawTotalB =
                calculateRawValue(
                    teamB
                );

            const adjustedA =
                calculateAdjustedTeamValue(
                    teamA
                );

            const adjustedB =
                calculateAdjustedTeamValue(
                    teamB
                );


            document.getElementById(
                "total-a"
            ).textContent =
                "Base: " +
                rawTotalA.toFixed(1) +
                " | Adjusted: " +
                adjustedA.toFixed(1);


            document.getElementById(
                "total-b"
            ).textContent =
                "Base: " +
                rawTotalB.toFixed(1) +
                " | Adjusted: " +
                adjustedB.toFixed(1);


            updateBalanceMeter(
                adjustedA,
                adjustedB
            );


            updateVerdict(
                adjustedA,
                adjustedB
            );

        }


        function calculateRawValue(team) {

            return team.reduce(
                function (
                    total,
                    player
                ) {

                    return (
                        total +
                        player.value
                    );

                },
                0
            );

        }


        /* =====================================================
           BALANCE METER
        ====================================================== */

        function updateBalanceMeter(
            adjustedA,
            adjustedB
        ) {

            const meterBar =
                document.getElementById(
                    "meter-bar"
                );

            const meterText =
                document.getElementById(
                    "meter-percentage"
                );


            const combinedValue =
                adjustedA +
                adjustedB;


            if (
                combinedValue <= 0
            ) {

                meterBar.style.width =
                    "50%";

                meterText.textContent =
                    "50% / 50%";

                return;

            }


            const percentageA =
                Math.round(
                    (
                        adjustedA /
                        combinedValue
                    ) *
                    100
                );


            const percentageB =
                100 -
                percentageA;


            meterBar.style.width =
                percentageA +
                "%";


            meterText.textContent =
                percentageA +
                "% / " +
                percentageB +
                "%";

        }


        /* =====================================================
           VERDICT
        ====================================================== */

        function updateVerdict(
            adjustedA,
            adjustedB
        ) {

            const heading =
                document.getElementById(
                    "verdict-heading"
                );


            if (
                teamA.length === 0 &&
                teamB.length === 0
            ) {

                heading.textContent =
                    "Add players to analyze";

                return;

            }


            if (
                teamA.length === 0 ||
                teamB.length === 0
            ) {

                heading.textContent =
                    "Add players to both sides";

                return;

            }


            const averageValue =
                (
                    adjustedA +
                    adjustedB
                ) /
                2;


            if (
                averageValue <= 0
            ) {

                heading.textContent =
                    "Unable to analyze trade";

                return;

            }


            const difference =
                Math.abs(
                    adjustedA -
                    adjustedB
                );


            const differencePercent =
                (
                    difference /
                    averageValue
                ) *
                100;


            let winningTeam = "";

            if (
                adjustedA >
                adjustedB
            ) {

                winningTeam =
                    "Team A";

            }

            else if (
                adjustedB >
                adjustedA
            ) {

                winningTeam =
                    "Team B";

            }


            if (
                differencePercent <= 5
            ) {

                heading.textContent =
                    "Fair Trade";

            }

            else if (
                differencePercent <= 10
            ) {

                heading.textContent =
                    "Slight Advantage: " +
                    winningTeam;

            }

            else if (
                differencePercent <= 20
            ) {

                heading.textContent =
                    "Advantage: " +
                    winningTeam;

            }

            else {

                heading.textContent =
                    "Major Advantage: " +
                    winningTeam;

            }

        }


        /* =====================================================
           THEME TOGGLE
        ====================================================== */

        function setupThemeToggle() {

            const toggleButton =
                document.getElementById(
                    "theme-toggle"
                );

            const htmlElement =
                document.documentElement;


            toggleButton.addEventListener(
                "click",
                function () {

                    const currentTheme =
                        htmlElement.getAttribute(
                            "data-theme"
                        );

                    const newTheme =
                        currentTheme === "dark"
                            ? "light"
                            : "dark";

                    htmlElement.setAttribute(
                        "data-theme",
                        newTheme
                    );

                }
            );

        }

function updateFairSuggestion(){

  if(!teamA.length||!teamB.length){
    fairBox.textContent="";
    return;
  }

  const a=calculateAdjustedTeamValue(teamA);
  const b=calculateAdjustedTeamValue(teamB);
  const avg=(a+b)/2;
  const diff=avg?Math.abs(a-b)/(avg/100):0;

  if(diff<=5){
    fairBox.textContent="✅ This trade is already within the fair range.";
    return;
  }

  const losing=a>b?teamB:teamA;
  const losingName=a>b?"Team B":"Team A";
  const target=a>b?a:b;

  const used=new Set(
    teamA.concat(teamB).map(function(p){
      return p.rank;
    })
  );

  let best=null;
  let bestDiff=Infinity;

  playerDatabase.forEach(function(p){

    if(used.has(p.rank)){
      return;
    }

    const testTeam=losing.concat([p]);
    const newValue=calculateAdjustedTeamValue(testTeam);
    const difference=Math.abs(newValue-target);

    if(bestDiff>difference){
      bestDiff=difference;
      best=p;
    }

  });

  if(best){
    fairBox.textContent=
      "⚖️ To make it closer: "+
      losingName+
      " could add "+
      best.name+
      " ("+
      best.value.toFixed(1)+
      ").";
  }else{
    fairBox.textContent="";
  }
}

      message+=" - Fair range";
    }

    if(index<topOptions.length-1){
      message+="\n";
    }

  });

};
