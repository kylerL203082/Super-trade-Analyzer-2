name: Update TradeForge Rankings

on:
  workflow_dispatch:

  schedule:
    - cron: "15 13 * * 2"
    - cron: "15 16 * * 5"
    - cron: "30 14 * * 0"

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TradeForge
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository files
        run: |
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Build TradeForge data feed
        run: |
          python scripts/update_tradeforge_data.py

      - name: Show generated JSON
        run: |
          echo "----- tradeforge-data.json -----"
          cat tradeforge-data.json
          echo "----- git status -----"
          git status
          echo "----- git diff -----"
          git diff -- tradeforge-data.json

      - name: Commit updated feed
        run: |
          if git diff --quiet -- tradeforge-data.json; then
            echo "No TradeForge data changes."
            exit 0
          fi

          git config user.name "TradeForge Bot"
          git config user.email "tradeforge-bot@users.noreply.github.com"

          git add tradeforge-data.json
          git commit -m "Update TradeForge rankings"
          git push
