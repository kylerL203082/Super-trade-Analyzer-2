name: Update TradeForge Rankings

on:
  workflow_dispatch:

  schedule:

    # Tuesday: major post-week recalculation
    - cron: "15 13 * * 2"

    # Friday: injury/practice refresh
    - cron: "15 16 * * 5"

    # Sunday morning: final refresh
    - cron: "30 14 * * 0"

permissions:
  contents: write

concurrency:
  group: tradeforge-rankings
  cancel-in-progress: true

jobs:

  update-rankings:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout TradeForge
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build TradeForge data feed
        run: python scripts/update_tradeforge_data.py

      - name: Validate feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("tradeforge-data.json").read_text()
          )

          assert data["meta"]["baselinePlayers"] >= 300
          assert isinstance(data["players"], dict)

          print(
              "Feed valid:",
              data["meta"]
          )
          PY

      - name: Commit updated feed
        run: |

          if git diff --quiet -- tradeforge-data.json; then
            echo "No TradeForge data changes."
            exit 0
          fi

          git config user.name "TradeForge Bot"
          git config user.email "tradeforge-bot@users.noreply.github.com"

          git add tradeforge-data.json

          git commit -m "Update TradeForge rankings"

          git push
